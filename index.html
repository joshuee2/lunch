<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#123524" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="40+ 맨손 운동" />
  <meta property="og:title" content="40-50 남성 홈트 코치" />
  <meta property="og:description" content="요일별 부위 운동 + 완료 보상 영어 회화" />
  <meta property="og:image" content="og_image.png" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://joshuee2.github.io/lunch/" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.png" />
  <link rel="apple-touch-icon" href="icon.png" />
  <title>40-50 남성 홈트 코치</title>
  <style>
    :root {
      --card: #ffffff;
      --primary: #123524;
      --accent: #3e7b4a;
      --text: #1f2a24;
      --muted: #5f6c65;
      --line: #dce5dd;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: linear-gradient(180deg, #edf5ef 0%, #f8faf7 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      min-height: 100vh;
      line-height: 1.45;
    }

    .app {
      max-width: 560px;
      margin: 0 auto;
      display: grid;
      gap: 12px;
      padding: 14px 14px calc(94px + var(--safe-bottom));
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 8px 24px rgba(18, 53, 36, 0.08);
    }

    h1 {
      margin: 0;
      font-size: clamp(22px, 6vw, 30px);
      line-height: 1.3;
      letter-spacing: -0.2px;
      word-break: keep-all;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
      word-break: keep-all;
    }

    .day-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      max-width: 100%;
      background: #e8f3ea;
      color: #205335;
      border: 1px solid #cfe2d2;
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 13px;
      font-weight: 700;
      margin-top: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .goal {
      margin-top: 12px;
      border-radius: 12px;
      background: #f7fbf7;
      border: 1px solid #deebdf;
      padding: 12px;
    }

    .goal h2 {
      margin: 0 0 8px;
      font-size: 19px;
    }

    .progress-wrap {
      margin: 10px 0 12px;
    }

    .progress-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .progress {
      width: 100%;
      height: 8px;
      border-radius: 999px;
      border: 0;
      overflow: hidden;
      background: #dce8de;
    }

    .progress::-webkit-progress-bar { background: #dce8de; }
    .progress::-webkit-progress-value { background: var(--accent); }
    .progress::-moz-progress-bar { background: var(--accent); }

    .goal ul {
      margin: 0;
      padding-left: 0;
      list-style: none;
      display: grid;
      gap: 8px;
    }

    .goal li {
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid #e2ebe3;
      border-radius: 10px;
      background: #ffffff;
      padding: 9px 10px;
      font-size: 14px;
    }

    .goal input[type="checkbox"] {
      inline-size: 21px;
      block-size: 21px;
      accent-color: var(--accent);
      flex: none;
    }

    .goal label {
      flex: 1;
      word-break: keep-all;
      cursor: pointer;
    }

    .goal input[type="checkbox"]:checked + label {
      text-decoration: line-through;
      color: #728078;
    }

    .small {
      font-size: 13px;
      color: var(--muted);
      margin: 10px 0 0;
      word-break: keep-all;
    }

    .actions {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 10px 14px calc(10px + var(--safe-bottom));
      background: linear-gradient(180deg, rgba(244, 247, 242, 0.6), #f4f7f2 22%);
      backdrop-filter: blur(4px);
    }

    .actions-inner {
      max-width: 560px;
      margin: 0 auto;
      display: grid;
      gap: 8px;
    }

    .btn {
      width: 100%;
      min-height: 48px;
      border: none;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:disabled {
      background: #8aa195;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: #edf3ed;
      color: var(--primary);
      border: 1px solid #d7e4d8;
    }

    .reward {
      display: none;
      border-left: 4px solid var(--accent);
      padding: 12px;
      background: #f5fbf6;
      border-radius: 10px;
      margin-top: 12px;
    }

    .reward.show { display: block; }

    .dialogue {
      margin: 8px 0 0;
      padding-left: 18px;
      display: grid;
      gap: 6px;
      font-size: 14px;
    }

    .status {
      margin-top: 10px;
      font-size: 14px;
      font-weight: 700;
      color: var(--accent);
      word-break: keep-all;
    }

    @media (min-width: 700px) {
      .actions { position: static; padding: 0; background: transparent; backdrop-filter: none; }
      .app { padding-bottom: 18px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="card">
      <h1>40-50 남성 홈트 코치</h1>
      <p class="subtitle">안드로이드 스마트폰(PWA 설치 가능)에서 바로 사용하는 요일별 맨손 운동 앱</p>
      <span id="dayBadge" class="day-badge"></span>

      <article class="goal">
        <h2 id="focusTitle"></h2>

        <div class="progress-wrap">
          <div class="progress-row">
            <span>체크 진행률</span>
            <strong id="progressText">0%</strong>
          </div>
          <progress id="progressBar" class="progress" max="100" value="0"></progress>
        </div>

        <ul id="workoutList"></ul>
        <p id="goalText" class="small"></p>
      </article>
      <p id="statusText" class="status"></p>
    </section>

    <section class="card">
      <div id="rewardBox" class="reward">
        <strong>🎁 보상: 원어민 소통 영어 대화</strong>
        <p id="dialogueTitle" class="small"></p>
        <ol id="dialogueList" class="dialogue"></ol>
      </div>
    </section>
  </main>

  <div class="actions">
    <div class="actions-inner">
      <button id="completeBtn" class="btn btn-primary">오늘 목표 완료하기 ✅</button>
      <button id="resetBtn" class="btn btn-secondary">오늘 완료 기록 초기화</button>
    </div>
  </div>

  <script>
    const plans = {
      0: {
        day: '일요일',
        focus: '회복 & 가동성',
        workouts: ['고양이-소 자세 10회 × 2세트', '전신 스트레칭 12분', '가벼운 걷기 20분'],
        goal: '몸을 회복시켜 다음 주 운동 효율을 높입니다.'
      },
      1: {
        day: '월요일',
        focus: '가슴 · 삼두',
        workouts: ['무릎/기본 푸시업 12회 × 4세트', '의자 딥스 10회 × 3세트', '플랭크 40초 × 3세트'],
        goal: '호흡을 유지하며 세트 간 휴식은 60초를 넘기지 않습니다.'
      },
      2: {
        day: '화요일',
        focus: '하체 · 코어',
        workouts: ['스쿼트 18회 × 4세트', '런지(좌/우) 12회 × 3세트', '데드버그 12회 × 3세트'],
        goal: '무릎보다 엉덩이 먼저 뒤로 빼며 하체를 안전하게 자극합니다.'
      },
      3: {
        day: '수요일',
        focus: '등 · 이두(맨손 변형)',
        workouts: ['수건 로우 15회 × 4세트', '리버스 스노우엔젤 12회 × 3세트', '슈퍼맨 홀드 30초 × 3세트'],
        goal: '등 수축을 느끼며 천천히 당기고 천천히 내려옵니다.'
      },
      4: {
        day: '목요일',
        focus: '어깨 · 코어 안정화',
        workouts: ['파이크 푸시업 10회 × 4세트', '사이드 플랭크 30초 × 3세트', '버드독 12회 × 3세트'],
        goal: '목에 힘을 빼고 견갑 안정에 집중합니다.'
      },
      5: {
        day: '금요일',
        focus: '전신 서킷',
        workouts: ['버피 8회', '푸시업 10회', '스쿼트 15회', '마운틴클라이머 30초 (4라운드)'],
        goal: '라운드 사이 90초 휴식으로 심폐 기능까지 함께 강화합니다.'
      },
      6: {
        day: '토요일',
        focus: '유산소 · 복부',
        workouts: ['제자리 걷기/조깅 25분', '레그레이즈 12회 × 3세트', '힐터치 20회 × 3세트'],
        goal: '무리하지 않는 강도로 꾸준함을 만듭니다.'
      }
    };

    const dialogues = [
      {
        title: '카페에서 스몰토크',
        lines: [
          'A: Hi, is this seat taken?',
          'B: No, please have a seat.',
          'A: Thanks. Do you come here often?',
          'B: Yeah, the coffee is great and people are friendly.'
        ]
      },
      {
        title: '출장 중 길 묻기',
        lines: [
          'A: Excuse me, how can I get to City Hall?',
          'B: Go straight for two blocks, then turn left.',
          'A: Is it far from here?',
          'B: Not really, about a ten-minute walk.'
        ]
      },
      {
        title: '헬스 관련 대화',
        lines: [
          'A: You look energetic these days. Working out?',
          'B: Yes, I do home workouts five days a week.',
          'A: Nice! What keeps you motivated?',
          'B: Small daily goals and visible progress.'
        ]
      }
    ];

    const dayBadge = document.getElementById('dayBadge');
    const focusTitle = document.getElementById('focusTitle');
    const workoutList = document.getElementById('workoutList');
    const goalText = document.getElementById('goalText');
    const statusText = document.getElementById('statusText');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');
    const completeBtn = document.getElementById('completeBtn');
    const resetBtn = document.getElementById('resetBtn');
    const rewardBox = document.getElementById('rewardBox');
    const dialogueTitle = document.getElementById('dialogueTitle');
    const dialogueList = document.getElementById('dialogueList');

    const today = new Date();
    const dayIndex = today.getDay();
    const todayPlan = plans[dayIndex];
    const date = today.toISOString().slice(0, 10);
    const dateKey = `workout_done_${date}`;
    const checkKey = `workout_checks_${date}`;

    function loadChecks() {
      try {
        return JSON.parse(localStorage.getItem(checkKey)) || [];
      } catch {
        return [];
      }
    }

    function saveChecks(checks) {
      localStorage.setItem(checkKey, JSON.stringify(checks));
    }

    function renderProgress(checks) {
      const total = todayPlan.workouts.length;
      const done = checks.filter(Boolean).length;
      const percent = Math.round((done / total) * 100);
      progressBar.value = percent;
      progressText.textContent = `${percent}% (${done}/${total})`;
    }

    function renderPlan() {
      const checks = loadChecks();
      dayBadge.textContent = `${todayPlan.day} · 오늘의 부위: ${todayPlan.focus}`;
      focusTitle.textContent = '오늘 운동 루틴';
      goalText.textContent = `목표: ${todayPlan.goal}`;
      workoutList.innerHTML = '';
      todayPlan.workouts.forEach((item, idx) => {
        const li = document.createElement('li');
        const id = `w-${idx}`;
        li.innerHTML = `<input id="${id}" type="checkbox" ${checks[idx] ? 'checked' : ''}><label for="${id}">${item}</label>`;
        const checkbox = li.querySelector('input');
        checkbox.addEventListener('change', () => {
          checks[idx] = checkbox.checked;
          saveChecks(checks);
          renderProgress(checks);
        });
        workoutList.appendChild(li);
      });
      renderProgress(checks);
    }

    function showReward() {
      const pick = dialogues[Math.floor(Math.random() * dialogues.length)];
      dialogueTitle.textContent = `오늘의 회화 주제: ${pick.title}`;
      dialogueList.innerHTML = '';
      pick.lines.forEach(line => {
        const li = document.createElement('li');
        li.textContent = line;
        dialogueList.appendChild(li);
      });
      rewardBox.classList.add('show');
    }

    function applyCompletionState() {
      const isDone = localStorage.getItem(dateKey) === 'done';
      if (isDone) {
        completeBtn.disabled = true;
        completeBtn.textContent = '오늘 목표 완료됨 🎉';
        statusText.textContent = '훌륭합니다! 오늘 운동은 이미 완료했어요.';
        showReward();
      } else {
        completeBtn.disabled = false;
        completeBtn.textContent = '오늘 목표 완료하기 ✅';
        statusText.textContent = '하단 완료 버튼으로 보상 대화를 받아보세요.';
        rewardBox.classList.remove('show');
      }
    }

    completeBtn.addEventListener('click', () => {
      localStorage.setItem(dateKey, 'done');
      applyCompletionState();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    resetBtn.addEventListener('click', () => {
      localStorage.removeItem(dateKey);
      localStorage.removeItem(checkKey);
      renderPlan();
      applyCompletionState();
    });

    renderPlan();
    applyCompletionState();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
